<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Katalog Peralatan CAMPUSGEAR">
  <title>CAMPUSGEAR | Katalog Peralatan</title>
  <link rel="stylesheet" href="/src/styles.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/">CAMPUSGEAR</a>
    <nav aria-label="Navigasi utama">
      <a href="/">Beranda</a>
      <a href="/peralatan.html">Peralatan</a>
      <a href="/peminjaman.html">Ajukan Peminjaman</a>
    </nav>
  </header>

  <main>
    <h1>Katalog Peralatan</h1>
    
    <!-- Controls Filter, Search, & Sort -->
    <section class="filter-section" aria-label="Pencarian dan Filter">
      <div class="filter-grid">
        <div>
          <label for="search-input">Cari Peralatan:</label>
          <input type="text" id="search-input" placeholder="Ketik nama peralatan...">
        </div>
        <div>
          <label for="category-filter">Kategori:</label>
          <select id="category-filter">
            <option value="all">Semua Kategori</option>
            <option value="Elektronika">Elektronika</option>
            <option value="Jaringan">Jaringan</option>
            <option value="Dokumentasi">Dokumentasi</option>
            <option value="Presentasi">Presentasi</option>
            <option value="Audio">Audio</option>
          </select>
        </div>
        <div>
          <label for="sort-option">Urutkan:</label>
          <select id="sort-option">
            <option value="az">Nama (A - Z)</option>
            <option value="za">Nama (Z - A)</option>
          </select>
        </div>
        <div class="checkbox-filter">
          <input type="checkbox" id="stock-filter">
          <label for="stock-filter">Hanya yang ada stok (> 0)</label>
        </div>
      </div>
    </section>

    <!-- Container Katalog Dinamis -->
    <section aria-labelledby="judul-katalog">
      <h2 id="judul-katalog">Daftar Peralatan</h2>
      <div id="catalog-list" class="equipment-list">
        <!-- Rendered dynamically by JS -->
      </div>
    </section>
  </main>

  <footer>
    <p><a href="/peminjaman.html">Lanjut ke formulir peminjaman</a></p>
  </footer>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
