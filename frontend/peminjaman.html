<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Formulir peminjaman CAMPUSGEAR">
  <title>CAMPUSGEAR | Peminjaman</title>
  <link rel="stylesheet" href="/src/styles.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/">CAMPUSGEAR</a>
    <nav aria-label="Navigasi utama">
      <a href="/">Beranda</a>
      <a href="/peralatan.html">Peralatan</a>
      <a href="/peminjaman.html">Ajukan Peminjaman</a>
    </nav>
  </header>

  <main>
    <h1>Formulir Peminjaman Peralatan</h1>
    
    <div id="error-message" class="alert-error" style="display: none;"></div>

    <form id="form-peminjaman" novalidate>
      <fieldset>
        <legend>Data Mahasiswa</legend>
        <label for="nim">NIM (8-12 Digit)</label>
        <input id="nim" name="nim" type="text" inputmode="numeric" required>

        <label for="nama">Nama Lengkap</label>
        <input id="nama" name="nama" type="text" required>
      </fieldset>

      <fieldset>
        <legend>Detail Peminjaman</legend>
        <label for="alat">Pilih Peralatan</label>
        <select id="alat" name="alat" required>
          <!-- Options populated dynamically by JS -->
        </select>

        <label for="jumlah">Jumlah Peminjaman</label>
        <input id="jumlah" name="jumlah" type="number" min="1" value="1" required>

        <label for="tanggal-pinjam">Tanggal Peminjaman</label>
        <input id="tanggal-pinjam" name="tanggal_pinjam" type="date" required>
      </fieldset>

      <button type="submit" class="btn-primary">Kirim Permohonan Peminjaman</button>
    </form>

    <section class="history-section">
      <h2>Riwayat Transaksi Peminjaman</h2>
      <div id="transaction-history">
        <!-- Rendered dynamically by JS -->
      </div>
    </section>
  </main>

  <footer>
    <p><a href="/peralatan.html">Kembali ke katalog</a></p>
  </footer>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
